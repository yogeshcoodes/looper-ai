<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parth AI - Material Design 3</title>

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* ===== Global Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Outfit", "Google Sans", sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease;
    }

    * {
      scroll-behavior: smooth;
    }

    input,
    textarea,
    button,
    select,
    a {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    a:focus,
    a:visited,
    a:active {
      outline: none;
    }

    body {
      width: 100%;
      /* Using dvh ensures mobile browser tabs don't cut the UI */
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* ===== CSS Variables (Light / Dark Theme) ===== */
    :root {
      --bg-color: #F0F4F9;
      --surface: #FFFFFF;
      --surface-hover: #F2F2F2;
      --primary: #0A56D0;
      --primary-hover: #0842A0;
      --text-main: #1F1F1F;
      --text-muted: #444746;
      --user-bubble: #D3E3FD;
      --ai-bubble: #FFFFFF;
      --border: #E0E2E5;
      --icon-color: #444746;
      --overlay: rgba(0, 0, 0, 0.4);
    }

    [data-theme="dark"] {
      --bg-color: #131314;
      --surface: #1E1F20;
      --surface-hover: #2A2B2C;
      --primary: #A8C7FA;
      --primary-hover: #D3E3FD;
      --text-main: #E3E3E3;
      --text-muted: #C4C7C5;
      --user-bubble: #004A77;
      --ai-bubble: #1E1F20;
      --border: #444746;
      --icon-color: #C4C7C5;
      --overlay: rgba(0, 0, 0, 0.6);
    }

    /* ===== Layout ===== */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      background: var(--bg-color);
    }

    /* ===== Header ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--icon-color);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 500;
      background: linear-gradient(90deg, #0A56D0, #A8C7FA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="dark"] .logo-text {
      background: linear-gradient(90deg, #A8C7FA, #D3E3FD);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== Sidebar / Drawer ===== */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100%;
      background: var(--surface);
      z-index: 100;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      margin-bottom: 24px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .menu-item:hover {
      background: var(--surface-hover);
    }

    /* ===== Chat Area ===== */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 85%;
    }

    .message-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-wrapper.ai {
      align-self: flex-start;
      align-items: flex-start;
      max-width: 90%;
    }

    .message {
      padding: 12px 16px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      border-radius: 24px;
    }

    .message.user {
      background: var(--user-bubble);
      color: var(--text-main);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      background: var(--ai-bubble);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .message img {
      width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }

    /* Action Icons below AI message */
    .msg-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      margin-left: 4px;
    }

    .msg-actions .icon-btn {
      width: 32px;
      height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg-actions .icon-btn span {
      font-size: 18px;
    }

    /* ===== Input Area ===== */
    .input-area {
      padding: 12px 16px;
      background: var(--bg-color);
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      background: var(--surface);
      border-radius: 24px;
      padding: 8px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--primary);
      color: var(--surface);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 2px;
    }

    [data-theme="dark"] .send-btn {
      color: #000;
    }

    .send-btn:hover {
      background: var(--primary-hover);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Typing Indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar Drawer -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">Parth AI</div>
    <div class="menu-item" onclick="toggleTheme()">
      <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
      <span id="themeText">Dark Mode</span>
    </div>
    <div class="menu-item">
      <span class="material-symbols-outlined">history</span>
      <span>Chat History</span>
    </div>
    <div class="menu-item">
      <span class="material-symbols-outlined">settings</span>
      <span>Settings</span>
    </div>
    <div class="menu-item" style="margin-top: auto; color: #d32f2f;">
      <span class="material-symbols-outlined">delete</span>
      <span onclick="clearChat()">Clear Chat</span>
    </div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-left">
        <button class="icon-btn" onclick="toggleSidebar()">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="logo-text">Parth AI</div>
      </div>
      <button class="icon-btn" onclick="toggleTheme()">
        <span class="material-symbols-outlined" id="headerThemeIcon">dark_mode</span>
      </button>
    </header>

    <!-- Chat Window -->
    <div class="chat-window" id="chatWindow">
      <div class="message-wrapper ai">
        <div class="message ai">Hi! I'm Parth AI. I can answer questions or generate images for you. Just ask! ✨</div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-container">
        <textarea id="userInput" rows="1" placeholder="Type a message or ask to draw something..."
          autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleSend()">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    let isGenerating = false;

    // ===== UI Logic =====

    // Auto-resize Textarea
    userInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
    });

    // Enter to send (Shift+Enter for new line)
    userInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);

      const icon = newTheme === 'light' ? 'dark_mode' : 'light_mode';
      const text = newTheme === 'light' ? 'Dark Mode' : 'Light Mode';

      document.getElementById('themeIcon').innerText = icon;
      document.getElementById('headerThemeIcon').innerText = icon;
      document.getElementById('themeText').innerText = text;
    }

    function clearChat() {
      chatWindow.innerHTML = `
      <div class="message-wrapper ai">
        <div class="message ai">Chat cleared! How can I help you now?</div>
      </div>`;
      toggleSidebar();
    }

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // ===== Chat Features (Copy & Read Aloud) =====

    function copyText(buttonElement) {
      const messageDiv = buttonElement.parentElement.previousElementSibling;
      let textToCopy = messageDiv.innerText;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const icon = buttonElement.querySelector('span');
        icon.innerText = "check";
        setTimeout(() => icon.innerText = "content_copy", 2000);
      });
    }

    function readAloud(buttonElement) {
      const messageDiv = buttonElement.parentElement.previousElementSibling;
      const textToRead = messageDiv.innerText.replace("Here is your image:", "");

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // stop previous
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);

        const icon = buttonElement.querySelector('span');
        icon.innerText = "volume_up";
        utterance.onend = () => icon.innerText = "campaign";
      } else {
        alert("Text-to-speech not supported in this browser.");
      }
    }

    // ===== Message Rendering =====

    function appendUserMessage(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper user';
      wrapper.innerHTML = `<div class="message user">${text}</div>`;
      chatWindow.appendChild(wrapper);
      scrollToBottom();
    }

    function appendAIMessage(content, isImage = false, fallbackImageUrls = []) {
      removeLoading();
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ai';

      let innerHTML = '';

      if (isImage) {
        // Image rendering with fallback logic baked into onerror attribute
        let fallbackStr = fallbackImageUrls.length > 0
          ? `this.onerror=null; this.src='${fallbackImageUrls[0]}';`
          : `this.onerror=null; this.alt='Failed to load image.';`;

        innerHTML = `
        <div class="message ai">
          Here is your image:
          <img src="${content}" alt="AI Generated Image" onerror="${fallbackStr}" onload="scrollToBottom()">
        </div>
      `;
      } else {
        innerHTML = `<div class="message ai">${content}</div>`;
      }

      // Add Copy & Read Aloud Action Buttons
      innerHTML += `
      <div class="msg-actions">
        <button class="icon-btn" onclick="copyText(this)" title="Copy Text"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="icon-btn" onclick="readAloud(this)" title="Read Aloud"><span class="material-symbols-outlined">campaign</span></button>
      </div>
    `;

      wrapper.innerHTML = innerHTML;
      chatWindow.appendChild(wrapper);
      scrollToBottom();
    }

    function showLoading() {
      isGenerating = true;
      sendBtn.disabled = true;
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ai';
      wrapper.id = 'loading';
      wrapper.innerHTML = `
      <div class="message ai">
        <div class="typing">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>`;
      chatWindow.appendChild(wrapper);
      scrollToBottom();
    }

    function removeLoading() {
      isGenerating = false;
      sendBtn.disabled = false;
      const loader = document.getElementById('loading');
      if (loader) loader.remove();
    }

    // ===== Advanced Intent Detection =====

    function checkImageIntent(text) {
      // Regex catches: "draw a cat", "can you generate an image of...", "drw car", "pic of dog", etc.
      const imageRegex = /(?:dr[oa]w|p[ai]nt|sket[c]?h|gen[e]?rat[e]?|cr[e]?at[e]?|mak[e]?).*(?:im[a]?g[e]?|pic(?:tur[e]?)?|photo(?:graph)?|art|por[t]?rait)|^(?:dr[oa]w|sket[c]?h|gen[e]?rat[e]?|pic(?:tur[e]?)? of)\b/i;

      if (imageRegex.test(text)) {
        // Remove commands to get just the prompt
        return text.replace(/^(can you |please )?(draw|paint|sketch|generate|create|make).{0,15}(image|pic|picture|photo|art)( of)?/i, '').trim() || text;
      }
      return null;
    }

    // ===== Multiple Fallback APIs =====

    async function fetchText(prompt) {
      // Fallback list of models on Pollinations
      const apis = [
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`,
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=llama`,
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=mistral`
      ];

      for (let url of apis) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.text();
        } catch (e) {
          console.warn("API failed, trying next fallback...");
        }
      }
      return "Oops! All my brain servers are resting right now. Please try again in a moment.";
    }

    async function handleSend() {
      if (isGenerating) return;
      let text = userInput.value.trim();
      if (!text) return;

      // Reset UI
      userInput.value = '';
      userInput.style.height = 'auto';
      appendUserMessage(text);
      showLoading();

      try {
        const imagePrompt = checkImageIntent(text);

        if (imagePrompt) {
          // IMAGE LOGIC with fallbacks
          const safePrompt = encodeURIComponent(imagePrompt);

          // Primary API
          const primaryImg = `https://image.pollinations.ai/prompt/${safePrompt}?nologo=true&seed=${Math.floor(Math.random() * 1000)}`;

          // Fallback APIs (Hercai or different Pollination seeds)
          const fallbacks = [
            `https://hercai.onrender.com/v3/text2image?prompt=${safePrompt}`,
            `https://image.pollinations.ai/prompt/${safePrompt}?nologo=true&model=flux`
          ];

          // Simulate network delay for realistic feel before rendering img tag
          setTimeout(() => {
            appendAIMessage(primaryImg, true, fallbacks);
          }, 1000);

        } else {
          // TEXT LOGIC with fallbacks
          const responseText = await fetchText(text);
          appendAIMessage(responseText);
        }
      } catch (error) {
        appendAIMessage("Sorry, something went wrong on my end. 😔");
        console.error(error);
      }
    }
  </script>

</body>

</html>
