<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parth AI</title>

  <!-- Favicon generated from SVG Logo (Pinwheel) with softer gradient -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%23A8C7FA' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M22 12a1 1 0 0 1-10 0 1 1 0 0 0-10 0'/%3E%3Cpath d='M7 20.7a1 1 0 1 1 5-8.7 1 1 0 1 0 5-8.6'/%3E%3Cpath d='M7 3.3a1 1 0 1 1 5 8.6 1 1 0 1 0 5 8.6'/%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3C/svg%3E">

  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

  <style>
    /* ===== Global Reset & Smooth Scroll ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Outfit", "Google Sans", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      scroll-behavior: smooth;
    }

    /* FIX: Ugly Focus Box Removed */
    input,
    textarea,
    button,
    select,
    a {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    a:focus,
    a:visited,
    a:active,
    button:focus,
    textarea:focus,
    input:focus,
    select:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    ::selection {
      background: var(--primary-light);
      color: var(--text-inverse);
    }

    /* ===== CSS Variables (Theme System) ===== */
    :root {
      /* Light Theme */
      --bg-color: #FFFFFF;
      --bg-glow-1: rgba(11, 87, 208, 0.08);
      --bg-glow-2: rgba(168, 199, 250, 0.12);
      --surface: #F0F4F9;
      --surface-hover: #E1E5EA;
      --primary: #0B57D0;
      --primary-light: #A8C7FA;
      --text-inverse: #000000;
      --text-main: #1F1F1F;
      --text-muted: #444746;
      --user-bubble: #F0F4F9;
      --border: #E0E2E5;
      --icon-color: #444746;
      --overlay: rgba(0, 0, 0, 0.3);
      --scrollbar-thumb: #C4C7C5;
      --modal-bg: #FFFFFF;
      /* Hero Gradient Light */
      --hero-grad-1: #0A56D0;
      --hero-grad-2: #0842A0;
    }

    [data-theme="dark"] {
      /* Dark Theme */
      --bg-color: #131314;
      --bg-glow-1: rgba(168, 199, 250, 0.05);
      --bg-glow-2: rgba(11, 87, 208, 0.06);
      --surface: #1E1F20;
      --surface-hover: #2A2B2C;
      --primary: #A8C7FA;
      --primary-light: #0A56D0;
      --text-inverse: #FFFFFF;
      --text-main: #E3E3E3;
      --text-muted: #C4C7C5;
      --user-bubble: #2A2B2C;
      --border: #444746;
      --icon-color: #C4C7C5;
      --overlay: rgba(0, 0, 0, 0.6);
      --scrollbar-thumb: #444746;
      --modal-bg: #1E1F20;
      /* Hero Gradient Dark */
      --hero-grad-1: #A8C7FA;
      --hero-grad-2: #D3E3FD;
    }

    /* ===== Animated Background Gradients ===== */
    body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at top left, var(--bg-glow-1) 0%, transparent 45%),
        radial-gradient(circle at bottom right, var(--bg-glow-2) 0%, transparent 45%);
      background-size: 200% 200%;
      background-attachment: fixed;
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
      animation: ambientFlow 14s ease-in-out infinite alternate;
      will-change: background-position;
    }

    @keyframes ambientFlow {
      0% {
        background-position: 0% 0%;
      }

      50% {
        background-position: 100% 100%;
      }

      100% {
        background-position: 0% 100%;
      }
    }

    /* ===== App Logo Component ===== */
    .app-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-logo svg {
      width: 28px;
      height: 28px;
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }

    /* ===== Header ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: transparent;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--icon-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      background: var(--surface);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* ===== Sidebar & Blur Overlay ===== */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s ease;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }

    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -320px;
      width: 280px;
      height: 100%;
      background: var(--bg-color);
      z-index: 100;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      margin-bottom: 30px;
      padding-left: 12px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 24px;
      cursor: pointer;
      color: var(--text-main);
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background: var(--surface);
    }

    /* ===== Chat Container & Content ===== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* GREETING HERO & Animated SVG Logo */
    .greeting-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 20px;
      width: 100%;
      transition: opacity 0.3s ease;
    }

    /* FIX: Rotation now controlled by JS via inline style for click/tap.
       Transition is slower (2.5s) and uses ease-in-out for slow start/stop. */
    .hero-logo-container {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 2.5s ease-in-out;
    }

    .greeting-title {
      font-size: 3.2rem;
      font-weight: 500;
      background: linear-gradient(90deg, var(--hero-grad-1), var(--hero-grad-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .greeting-subtitle {
      font-size: 1.6rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .chat-content {
      width: 100%;
      max-width: 850px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Messages Style ===== */
    .message-wrapper {
      display: flex;
      width: 100%;
      animation: fadeInUp 0.4s ease forwards;
    }

    .message-wrapper.user {
      justify-content: flex-end;
    }

    .message-wrapper.user .msg-content {
      background: var(--user-bubble);
      padding: 14px 20px;
      border-radius: 24px 24px 4px 24px;
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 85%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* AI Message Style */
    .message-wrapper.ai {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 100%;
    }

    .ai-top-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
    }

    .ai-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .ai-avatar svg {
      width: 20px;
      height: 20px;
    }

    .ai-text {
      font-size: 1.05rem;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      color: var(--text-main);
      margin-top: 4px;
      flex: 1;
    }

    .ai-text img {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      margin-top: 12px;
      display: block;
    }

    .msg-actions {
      display: flex;
      gap: 4px;
      margin-top: 12px;
      margin-left: 52px;
      opacity: 0.8;
    }

    .msg-actions .icon-btn {
      width: 36px;
      height: 36px;
      color: var(--text-muted);
    }

    .msg-actions .icon-btn:hover {
      color: var(--text-main);
      background: var(--surface);
    }

    /* ===== Input Area ===== */
    .input-area {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 12px 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .input-wrapper {
      width: 100%;
      max-width: 850px;
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      background: var(--surface);
      border-radius: 32px;
      padding: 10px 16px;
      transition: all 0.3s;
    }

    .input-container:focus-within {
      background: var(--surface-hover);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 12px;
      font-size: 1.05rem;
      color: var(--text-main);
      resize: none;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 2px;
      transition: 0.2s;
    }

    .send-btn.active {
      color: var(--primary);
      background: var(--surface);
    }

    .send-btn:active {
      transform: scale(0.9);
    }

    /* Typing Dots */
    .typing {
      display: flex;
      gap: 4px;
      padding: 10px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: blink 1.4s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* ===== Custom UI Elements (Modal & Dropdown) ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s ease;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .modal {
      background: var(--modal-bg);
      width: 90%;
      max-width: 400px;
      border-radius: 24px;
      padding: 24px;
      transform: translateY(20px);
      opacity: 0;
      transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header h3 {
      font-weight: 500;
      font-size: 1.3rem;
      margin: 0;
    }

    .modal-group {
      margin-bottom: 30px;
      position: relative;
    }

    .setting-label {
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Custom Dropdown Styling */
    .custom-select {
      position: relative;
      width: 100%;
      font-size: 1rem;
    }

    .select-selected {
      background: var(--surface);
      color: var(--text-main);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .select-selected:hover {
      background: var(--surface-hover);
    }

    .select-items {
      position: absolute;
      background: var(--surface);
      top: 100%;
      left: 0;
      right: 0;
      z-index: 99;
      margin-top: 8px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s ease;
    }

    .select-items.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .select-items div {
      color: var(--text-main);
      padding: 14px 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .select-items div:hover {
      background: var(--surface-hover);
      color: var(--primary);
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 100px;
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    [data-theme="dark"] .modal-btn {
      color: #000;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- Base Gradient Definitions for SVGs -->
  <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
    <defs>
      <!-- FIX: Adjusted stop color to #669DF6 for a softer, more subtle gradient -->
      <linearGradient id="paint0_linear" x1="2" y1="12" x2="22" y2="12" gradientUnits="userSpaceOnUse">
        <stop stop-color="#A8C7FA" />
        <stop offset="1" stop-color="#669DF6" />
      </linearGradient>
    </defs>
  </svg>

  <!-- NEW Raw SVG Logo String (Pinwheel) for re-use without <use> bugs -->
  <script>
    const svgLogoRaw = `
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M22 12a1 1 0 0 1-10 0 1 1 0 0 0-10 0"/>
      <path d="M7 20.7a1 1 0 1 1 5-8.7 1 1 0 1 0 5-8.6"/>
      <path d="M7 3.3a1 1 0 1 1 5 8.6 1 1 0 1 0 5 8.6"/>
      <circle cx="12" cy="12" r="10"/>
    </svg>
  `;
  </script>

  <!-- Sidebar & Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header app-logo">
      <div style="width: 28px; height: 28px;" id="sidebarLogoContainer"></div>
      <div class="logo-text">Parth AI</div>
    </div>
    <div class="menu-item" onclick="toggleTheme()">
      <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
      <span id="themeText">Light Mode</span>
    </div>
    <div class="menu-item" onclick="openSettings()">
      <span class="material-symbols-outlined">settings</span>
      <span>Settings</span>
    </div>
    <div class="menu-item" style="color: #d32f2f;" onclick="clearChat()">
      <span class="material-symbols-outlined">delete</span>
      <span>Clear Chat</span>
    </div>
  </div>

  <!-- Settings Modal with Custom Dropdown -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <span class="material-symbols-outlined">tune</span>
        <h3>AI Settings</h3>
      </div>

      <div class="modal-group">
        <div class="setting-label">Select Brain (Text Model)</div>
        <div class="custom-select">
          <div class="select-selected" id="selectSelected" onclick="toggleDropdown()" role="button" tabindex="0"
            aria-haspopup="listbox">
            <span id="selectedModelText">ChatGPT (Default & Smart)</span>
            <span class="material-symbols-outlined">expand_more</span>
          </div>
          <div class="select-items" id="selectItems" role="listbox">
            <div onclick="selectModel('openai', 'ChatGPT (Default & Smart)')" role="option">ChatGPT (Default & Smart)
            </div>
            <div onclick="selectModel('llama', 'Llama 3 (Creative)')" role="option">Llama 3 (Creative)</div>
            <div onclick="selectModel('mistral', 'Mistral (Fast)')" role="option">Mistral (Fast)</div>
          </div>
        </div>
      </div>
      <button class="modal-btn" onclick="closeSettings()">Save Settings</button>
    </div>
  </div>

  <!-- Main Header -->
  <header>
    <div class="header-left">
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Open Menu">
        <span class="material-symbols-outlined">segment</span>
      </button>
      <div class="app-logo">
        <div class="logo-text">Parth AI</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </header>

  <!-- Chat Container -->
  <div class="chat-container" id="chatContainer">
    <!-- Centered Greeting Hero -->
    <div class="greeting-screen" id="greetingScreen">
      <!-- Clickable/Tappable Hero Logo -->
      <div class="hero-logo-container" id="heroLogoContainer"></div>
      <h1 class="greeting-title">Hello</h1>
      <p class="greeting-subtitle">How can I help you today?</p>
    </div>

    <div class="chat-content" id="chatContent"></div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-container">
        <textarea id="userInput" aria-label="Message input field" rows="1" placeholder="" autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleSend()" aria-label="Send Message">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Insert initial SVGs
    document.getElementById('sidebarLogoContainer').innerHTML = svgLogoRaw;
    document.getElementById('heroLogoContainer').innerHTML = svgLogoRaw;

    // Elements
    const chatContainer = document.getElementById('chatContainer');
    const chatContent = document.getElementById('chatContent');
    const greetingScreen = document.getElementById('greetingScreen');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const settingsModal = document.getElementById('settingsModal');

    // FIX: Hero Logo Click Rotation Logic
    const heroLogo = document.getElementById('heroLogoContainer');
    let heroRotation = 0;
    heroLogo.addEventListener('click', () => {
      heroRotation += 360;
      heroLogo.style.transform = `rotate(${heroRotation}deg)`;
    });

    // Custom Dropdown State
    let activeModel = 'openai';
    const selectItems = document.getElementById('selectItems');
    const selectedModelText = document.getElementById('selectedModelText');
    let isGenerating = false;

    // ===== Typewriter Placeholder Logic =====
    const placeholderPhrases = [
      "Say hello...",
      "Imagine a neon city...",
      "Write a short poem...",
      "Draw a flying car...",
      "Tell me a joke..."
    ];
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeletingPlaceholder = false;

    function typeWriterPlaceholder() {
      const currentText = placeholderPhrases[phraseIndex];

      if (isDeletingPlaceholder) {
        userInput.setAttribute("placeholder", currentText.substring(0, charIndex - 1));
        charIndex--;
      } else {
        userInput.setAttribute("placeholder", currentText.substring(0, charIndex + 1));
        charIndex++;
      }

      // Typing speed: normal vs deleting
      let speed = isDeletingPlaceholder ? 40 : 80;

      // Pause at the end of the phrase for 2 seconds
      if (!isDeletingPlaceholder && charIndex === currentText.length) {
        speed = 2000;
        isDeletingPlaceholder = true;
      } else if (isDeletingPlaceholder && charIndex === 0) {
        isDeletingPlaceholder = false;
        phraseIndex = (phraseIndex + 1) % placeholderPhrases.length;
        speed = 400; // Pause before typing the next phrase
      }

      setTimeout(typeWriterPlaceholder, speed);
    }

    // Start the placeholder typewriter effect
    typeWriterPlaceholder();

    // ===== Dynamic UI Logic =====
    userInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight < 150 ? this.scrollHeight : 150) + 'px';
      sendBtn.classList.toggle('active', this.value.trim().length > 0);
    });

    userInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeIcon').innerText = isDark ? 'dark_mode' : 'light_mode';
      document.getElementById('themeText').innerText = isDark ? 'Dark Mode' : 'Light Mode';
    }

    // Custom Dropdown Logic
    function toggleDropdown() { selectItems.classList.toggle('show'); }
    function selectModel(val, text) {
      activeModel = val;
      selectedModelText.innerText = text;
      selectItems.classList.remove('show');
    }

    // Close dropdown & menus on outside click
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.custom-select')) {
        selectItems.classList.remove('show');
      }
    });

    function openSettings() {
      settingsModal.classList.add('open');
      if (sidebar.classList.contains('open')) toggleSidebar();
    }
    function closeSettings() { settingsModal.classList.remove('open'); selectItems.classList.remove('show'); }

    function clearChat() {
      chatContent.innerHTML = '';
      greetingScreen.style.display = 'flex';
      setTimeout(() => greetingScreen.style.opacity = '1', 50);
      toggleSidebar();
    }

    function scrollToBottom() {
      setTimeout(() => {
        chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    // ===== Tools (Copy & TTS) =====
    function copyText(btn) {
      const text = btn.closest('.message-wrapper').querySelector('.ai-text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const icon = btn.querySelector('span');
        icon.innerText = "check";
        setTimeout(() => icon.innerText = "content_copy", 2000);
      });
    }

    function readAloud(btn) {
      const text = btn.closest('.message-wrapper').querySelector('.ai-text').innerText;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
        const icon = btn.querySelector('span');
        icon.innerText = "stop_circle";
        utterance.onend = () => icon.innerText = "volume_up";
      }
    }

    // ===== Message Rendering =====
    function hideGreeting() {
      if (greetingScreen.style.display !== 'none') {
        greetingScreen.style.opacity = '0';
        setTimeout(() => greetingScreen.style.display = 'none', 300);
      }
    }

    function appendUserMessage(text) {
      hideGreeting();
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper user';
      wrapper.innerHTML = `<div class="msg-content">${text}</div>`;
      chatContent.appendChild(wrapper);
      scrollToBottom();
    }

    function appendAIMessage(content, isImage = false, fallbackUrls = []) {
      removeLoading();
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ai';

      let aiContent = '';
      if (isImage) {
        let fallbackStr = fallbackUrls.length > 0
          ? `this.onerror=null; this.src='${fallbackUrls[0]}';`
          : `this.onerror=null; this.alt='Image generation failed.';`;
        aiContent = `<img src="${content}" alt="Generated Art" onerror="${fallbackStr}" onload="scrollToBottom()">`;
      } else {
        aiContent = content.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      }

      wrapper.innerHTML = `
      <div class="ai-top-row">
        <div class="ai-avatar">${svgLogoRaw}</div>
        <div class="ai-text">${aiContent}</div>
      </div>
      ${!isImage ? `
      <div class="msg-actions">
        <button class="icon-btn" onclick="copyText(this)" title="Copy"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="icon-btn" onclick="readAloud(this)" title="Read"><span class="material-symbols-outlined">volume_up</span></button>
      </div>` : ''}
    `;
      chatContent.appendChild(wrapper);
      scrollToBottom();
    }

    function showLoading() {
      isGenerating = true;
      sendBtn.classList.remove('active');
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ai';
      wrapper.id = 'loadingIndicator';
      wrapper.innerHTML = `
      <div class="ai-top-row">
        <div class="ai-avatar">${svgLogoRaw}</div>
        <div class="ai-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
      </div>`;
      chatContent.appendChild(wrapper);
      scrollToBottom();
    }

    function removeLoading() {
      isGenerating = false;
      const loader = document.getElementById('loadingIndicator');
      if (loader) loader.remove();
    }

    // ===== Intent Detection & API =====
    function extractImagePrompt(text) {
      const regex = /^(?:can you\s+|please\s+|could you\s+)?(?:imagine|dr[oa]w|p[ai]nt|sket[c]?h|gen[e]?r[a]?t[e]?|cr[e]?at[e]?|mak[e]?)(?:\s+(?:a|an|the|some))?(?:\s+(?:im[a]?g[e]?|pic(?:ture)?|photo(?:graph)?|art(?:work)?|portrait))?(?:\s+of)?\s+(.+)/i;
      const match = text.match(regex);
      return match ? match[1].trim() : null;
    }

    async function fetchTextResponse(prompt) {
      const apis = [
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=${activeModel}`,
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`,
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=mistral`
      ];

      for (let url of apis) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.text();
        } catch (e) { console.warn("Retrying fallback text model..."); }
      }
      return "Servers are currently busy. Please try again in a few seconds.";
    }

    async function handleSend() {
      if (isGenerating) return;
      let text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.classList.remove('active');

      appendUserMessage(text);
      showLoading();

      try {
        const imagePrompt = extractImagePrompt(text);

        if (imagePrompt) {
          const encodedPrompt = encodeURIComponent(imagePrompt);
          const randomSeed = Math.floor(Math.random() * 99999);
          const primaryImg = `https://image.pollinations.ai/prompt/${encodedPrompt}?nologo=true&seed=${randomSeed}`;
          const fallbackUrls = [
            `https://image.pollinations.ai/prompt/${encodedPrompt}?nologo=true&model=flux`,
            `https://hercai.onrender.com/v3/text2image?prompt=${encodedPrompt}`
          ];
          setTimeout(() => appendAIMessage(primaryImg, true, fallbackUrls), 800);
        } else {
          const responseText = await fetchTextResponse(text);
          appendAIMessage(responseText);
        }
      } catch (error) {
        appendAIMessage("Connection error. Check your internet.");
      }
    }
  </script>

</body>

</html>
